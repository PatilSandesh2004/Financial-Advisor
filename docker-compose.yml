version: '3.9'
services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: ['redis_data:/data']

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fin_advisor
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports: ['5432:5432']
    volumes: ['pg_data:/var/lib/postgresql/data']

  backend:
    build: .
    command: sh -c "uvicorn backend.main:app --host 0.0.0.0 --port 8050"
    ports: ['8050:8050']
    depends_on: [redis, postgres]
    env_file: .env

  ui:
    build:
      context: .
      dockerfile: UI/web/Dockerfile
    command: sh /app/start.sh
    ports: ['8080:8080']
    depends_on: [backend]
    environment:
      - UI_API_BASE_URL=http://backend:8050/api/v1

volumes:
  redis_data:
  pg_data:
